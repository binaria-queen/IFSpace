<div class="container">
    <h2>Gerenciar Aulas</h2>
  
    <!-- Formulário para adicionar/editar aula -->
    <form (submit)="salvarAula()" class="form">
      <label>Disciplina:</label>
      <input type="number" [(ngModel)]="aulaForm.disciplina_id" name="disciplina_id" required />
  
      <label>Sala:</label>
      <input type="number" [(ngModel)]="aulaForm.sala_id" name="sala_id" required />
  
      <label>Dia da Semana:</label>
      <select [(ngModel)]="aulaForm.diaSemana" name="diaSemana" required>
        <option value="Segunda">Segunda</option>
        <option value="Terça">Terça</option>
        <option value="Quarta">Quarta</option>
        <option value="Quinta">Quinta</option>
        <option value="Sexta">Sexta</option>
        <option value="Sábado">Sábado</option>
        <option value="Domingo">Domingo</option>
      </select>
  
      <label>Horário de Início:</label>
      <input type="datetime-local" [(ngModel)]="aulaForm.horarioInicio" name="horarioInicio" required />
  
      <label>Duração (min):</label>
      <input type="number" [(ngModel)]="aulaForm.duracao" name="duracao" required />
  
      <button type="submit">{{ aulaForm.id ? 'Atualizar Aula' : 'Criar Aula' }}</button>
    </form>
  
    <!-- Lista de Aulas -->
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Disciplina</th>
          <th>Sala</th>
          <th>Dia</th>
          <th>Horário</th>
          <th>Duração</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let aula of aulas">
          <td>{{ aula.id }}</td>
          <td>{{ aula.disciplina_id }}</td>
          <td>{{ aula.sala_id }}</td>
          <td>{{ aula.diaSemana }}</td>
          <td>{{ aula.horarioInicio | date:'short' }}</td>
          <td>{{ aula.duracao }} min</td>
          <td>
            <button (click)="editarAula(aula)">✏️ Editar</button>
            <button (click)="excluirAula(aula.id)">🗑 Excluir</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
