<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Disciplinas</title>
    <link rel="stylesheet" href="disciplinas.css">
</head>
<body>

    <header>
        <h1>Gestão de Disciplinas</h1>
    </header>

    <main>
        <button id="btnCriar" class="btn criar-btn">Criar Disciplina</button>
        
        <table>
            <thead>
                <tr>
                    <th class="hidden">ID</th>
                    <th>Nome</th>
                    <th>Código da Turma</th>
                    <th>Professor</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="disciplinaLista"></tbody>
        </table>
    </main>

    <footer>
        <p>© 2025 Gestão de Disciplinas</p>
    </footer>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitulo">Criar Disciplina</h2>
            <input type="hidden" id="disciplinaId">
            <label>Nome:</label>
            <input type="text" id="nome" required>
            <label>Código da Turma:</label>
            <input type="text" id="codigoTurma" required>
            <label>Nome do Professor:</label>
            <input type="text" id="nomeProfessor" required>
            <button id="salvarBtn" class="btn">Salvar</button>
            <button id="cancelarBtn" class="btn">Cancelar</button>
        </div>
    </div>

    <script src="disciplinas.js"></script>

</body>
</html>
